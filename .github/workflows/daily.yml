name: Daily Sports Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # 每天香港時間早上 08:00 自動執行
  workflow_dispatch:      # 支援手動按鈕觸發測試

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 讀取程式碼
        uses: actions/checkout@v3

      - name: 安裝 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          pip install pandas openpyxl requests

      - name: 執行 Python 腳本
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py

